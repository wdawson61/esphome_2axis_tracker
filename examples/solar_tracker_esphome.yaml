# Solar Tracker ESP32 - ESPHome Configuration
#
# This ESPHome config provides the same functionality as the Arduino version
# but integrates directly with Home Assistant via ESPHome/API
#
# Hardware:
# - ESP32 (any variant)
# - MPU9250 9-axis IMU (I2C)
# - Motor drivers with PWM control
# - Limit switches
#
# Install: esphome run solar-tracker-esp32.yaml

esphome:
  name: solar-tracker-esp32
  friendly_name: Solar Tracker ESP32
  platform: ESP32
  board: esp32dev

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret solar_tracker_api_key

ota:
  password: !secret solar_tracker_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "Solar-Tracker"
    password: "solartrack123"

# Web server for direct access
web_server:
  port: 80

# I2C for IMU
i2c:
  sda: 21
  scl: 22
  scan: true
  frequency: 400kHz

# MPU9250 9-axis IMU sensor
sensor:
  # Accelerometer (m/s²)
  - platform: mpu6050
    address: 0x68
    accel_x:
      name: "Tracker Accel X"
      id: accel_x
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    accel_y:
      name: "Tracker Accel Y"
      id: accel_y
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    accel_z:
      name: "Tracker Accel Z"
      id: accel_z
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    
    # Gyroscope (°/s)
    gyro_x:
      name: "Tracker Gyro X"
      id: gyro_x
    gyro_y:
      name: "Tracker Gyro Y"
      id: gyro_y
    gyro_z:
      name: "Tracker Gyro Z"
      id: gyro_z
    
    # Temperature
    temperature:
      name: "Tracker IMU Temperature"
      id: imu_temp
    
    update_interval: 100ms  # 10Hz

  # Magnetometer (μT) - Separate sensor on MPU9250
  - platform: template
    name: "Tracker Mag X"
    id: mag_x
    unit_of_measurement: "μT"
    accuracy_decimals: 2
    lambda: |-
      // TODO: Read AK8963 magnetometer via I2C
      // For now return 0, implement custom component if needed
      return 0.0;
    update_interval: 100ms
  
  - platform: template
    name: "Tracker Mag Y"
    id: mag_y
    unit_of_measurement: "μT"
    accuracy_decimals: 2
    lambda: return 0.0;
    update_interval: 100ms
  
  - platform: template
    name: "Tracker Mag Z"
    id: mag_z
    unit_of_measurement: "μT"
    accuracy_decimals: 2
    lambda: return 0.0;
    update_interval: 100ms

  # WiFi Signal
  - platform: wifi_signal
    name: "Tracker WiFi Signal"
    update_interval: 60s

# Binary sensors for limit switches
binary_sensor:
  # Azimuth limits
  - platform: gpio
    pin:
      number: 32
      mode: INPUT_PULLUP
      inverted: true
    name: "Azimuth CW Limit"
    id: az_cw_limit
    device_class: safety
    
  - platform: gpio
    pin:
      number: 33
      mode: INPUT_PULLUP
      inverted: true
    name: "Azimuth CCW Limit"
    id: az_ccw_limit
    device_class: safety
  
  # Elevation limits
  - platform: gpio
    pin:
      number: 34
      mode: INPUT_PULLUP
      inverted: true
    name: "Elevation UP Limit"
    id: el_up_limit
    device_class: safety
    
  - platform: gpio
    pin:
      number: 35
      mode: INPUT_PULLUP
      inverted: true
    name: "Elevation DOWN Limit"
    id: el_down_limit
    device_class: safety

# PWM outputs for motor control
output:
  # Azimuth motor PWM
  - platform: ledc
    pin: 26
    id: motor_az_pwm
    frequency: 5000Hz
  
  # Azimuth motor direction
  - platform: gpio
    pin: 25
    id: motor_az_dir
  
  # Elevation motor PWM
  - platform: ledc
    pin: 14
    id: motor_el_pwm
    frequency: 5000Hz
  
  # Elevation motor direction
  - platform: gpio
    pin: 27
    id: motor_el_dir

# Number inputs for motor speed control (-100 to 100)
number:
  - platform: template
    name: "Azimuth Motor Speed"
    id: azimuth_speed
    min_value: -100
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    set_action:
      then:
        - lambda: |-
            float speed = x;
            
            // Check limits
            if ((id(az_cw_limit).state && speed > 0) ||
                (id(az_ccw_limit).state && speed < 0)) {
              ESP_LOGW("motor", "Azimuth limit hit, stopping");
              speed = 0;
              id(azimuth_speed).publish_state(0);
            }
            
            // Set direction
            if (speed >= 0) {
              id(motor_az_dir).turn_on();
            } else {
              id(motor_az_dir).turn_off();
            }
            
            // Set PWM (0-100% maps to 0-1.0)
            float pwm = abs(speed) / 100.0;
            id(motor_az_pwm).set_level(pwm);
            
            ESP_LOGI("motor", "Azimuth speed set to: %.1f", speed);

  - platform: template
    name: "Elevation Motor Speed"
    id: elevation_speed
    min_value: -100
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    set_action:
      then:
        - lambda: |-
            float speed = x;
            
            // Check limits
            if ((id(el_up_limit).state && speed > 0) ||
                (id(el_down_limit).state && speed < 0)) {
              ESP_LOGW("motor", "Elevation limit hit, stopping");
              speed = 0;
              id(elevation_speed).publish_state(0);
            }
            
            // Set direction
            if (speed >= 0) {
              id(motor_el_dir).turn_on();
            } else {
              id(motor_el_dir).turn_off();
            }
            
            // Set PWM (0-100% maps to 0-1.0)
            float pwm = abs(speed) / 100.0;
            id(motor_el_pwm).set_level(pwm);
            
            ESP_LOGI("motor", "Elevation speed set to: %.1f", speed);

# Buttons for motor control
button:
  - platform: template
    name: "Stop All Motors"
    icon: "mdi:stop"
    on_press:
      - number.set:
          id: azimuth_speed
          value: 0
      - number.set:
          id: elevation_speed
          value: 0
      - logger.log: "All motors stopped"

  - platform: template
    name: "Emergency Stop"
    icon: "mdi:alert-octagon"
    on_press:
      - output.turn_off: motor_az_pwm
      - output.turn_off: motor_el_pwm
      - number.set:
          id: azimuth_speed
          value: 0
      - number.set:
          id: elevation_speed
          value: 0
      - logger.log:
          format: "EMERGENCY STOP"
          level: WARN

  - platform: restart
    name: "Restart ESP32"

# Text sensors for status
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Tracker IP Address"
    ssid:
      name: "Tracker WiFi SSID"

# HTTP request handling for compatibility with add-on
# Note: ESPHome's web_server already provides basic API
# For full compatibility, use Home Assistant's RESTful integration

